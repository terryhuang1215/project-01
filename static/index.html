<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Calculator</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.82);
        --panel-border: rgba(148, 163, 184, 0.22);
        --screen: #e2e8f0;
        --screen-accent: #38bdf8;
        --key: rgba(148, 163, 184, 0.15);
        --key-hover: rgba(148, 163, 184, 0.25);
        --key-operator: rgba(56, 189, 248, 0.2);
        --key-operator-hover: rgba(56, 189, 248, 0.35);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --danger: #f87171;
        --shadow: rgba(15, 23, 42, 0.5);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.2), transparent 35%),
          linear-gradient(135deg, #020817 0%, #0f172a 45%, #111827 100%);
        font-family: Inter, "Segoe UI", sans-serif;
        color: var(--text);
      }

      .calculator {
        width: min(92vw, 410px);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        box-shadow: 0 28px 60px var(--shadow);
        padding: 24px 20px 18px;
        backdrop-filter: blur(12px);
      }

      .screen {
        background: rgba(15, 23, 42, 0.75);
        border-radius: 20px;
        padding: 18px 16px;
        margin-bottom: 18px;
        border: 1px solid rgba(148, 163, 184, 0.12);
      }

      .expression {
        min-height: 28px;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .result {
        min-height: 52px;
        margin-top: 12px;
        color: var(--screen);
        font-size: clamp(2rem, 7vw, 2.7rem);
        font-weight: 700;
        text-align: right;
        letter-spacing: 0.04em;
        word-break: break-all;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 18px;
        padding: 18px 0;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text);
        background: var(--key);
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      button:hover {
        background: var(--key-hover);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      .operator {
        background: var(--key-operator);
        color: #e0f2fe;
      }

      .operator:hover {
        background: var(--key-operator-hover);
      }

      .equal {
        background: linear-gradient(135deg, #38bdf8, #0ea5e9);
        color: #082f49;
      }

      .equal:hover {
        background: linear-gradient(135deg, #7dd3fc, #38bdf8);
      }

      .wide {
        grid-column: span 2;
      }

      .error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <div class="screen">
        <div id="expression" class="expression">0</div>
        <div id="result" class="result">0</div>
      </div>
      <div class="buttons">
        <button class="operator" data-action="clear">AC</button>
        <button class="operator" data-action="delete">DEL</button>
        <button class="operator" data-action="operator">%</button>
        <button class="operator" data-action="operator">/</button>

        <button data-action="digit">7</button>
        <button data-action="digit">8</button>
        <button data-action="digit">9</button>
        <button class="operator" data-action="operator">*</button>

        <button data-action="digit">4</button>
        <button data-action="digit">5</button>
        <button data-action="digit">6</button>
        <button class="operator" data-action="operator">-</button>

        <button data-action="digit">1</button>
        <button data-action="digit">2</button>
        <button data-action="digit">3</button>
        <button class="operator" data-action="operator">+</button>

        <button class="wide" data-action="digit">0</button>
        <button data-action="digit">.</button>
        <button class="equal" data-action="equals">=</button>
      </div>
    </div>

    <script>
      const expressionEl = document.getElementById('expression');
      const resultEl = document.getElementById('result');
      let expression = '0';
      let lastAnswer = 0;

      function updateDisplay() {
        expressionEl.textContent = expression || '0';
        resultEl.textContent = String(lastAnswer);
      }

      function appendValue(value) {
        if (expression === '0' && value !== '.') {
          expression = value;
        } else {
          expression += value;
        }
        resultEl.classList.remove('error');
        updateDisplay();
      }

      function handleOperator(value) {
        const last = expression.slice(-1);
        if (['+', '-', '*', '/', '%'].includes(last)) {
          expression = expression.slice(0, -1) + value;
        } else if (expression === '0' && value === '-') {
          expression = '-';
        } else {
          expression += value;
        }
        updateDisplay();
      }

      function clearAll() {
        expression = '0';
        lastAnswer = 0;
        updateDisplay();
      }

      function deleteLast() {
        expression = expression.length <= 1 ? '0' : expression.slice(0, -1);
        updateDisplay();
      }

      async function evaluateExpression() {
        const query = expression.trim();
        if (!query || query === '0') {
          lastAnswer = 0;
          updateDisplay();
          return;
        }

        try {
          const response = await fetch('/api/calc', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ expression: query })
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || 'Invalid expression');
          }

          lastAnswer = data.result;
          expression = String(data.result);
          resultEl.classList.remove('error');
          updateDisplay();
        } catch (error) {
          resultEl.textContent = 'Error';
          resultEl.classList.add('error');
          expressionEl.textContent = query;
          console.error(error);
        }
      }

      document.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          const action = button.dataset.action;
          const value = button.textContent.trim();

          if (action === 'digit') {
            appendValue(value);
          } else if (action === 'operator') {
            handleOperator(value);
          } else if (action === 'clear') {
            clearAll();
          } else if (action === 'delete') {
            deleteLast();
          } else if (action === 'equals') {
            evaluateExpression();
          }
        });
      });

      updateDisplay();
    </script>
  </body>
</html>
